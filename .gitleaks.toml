[extend]
useDefault = true

# The fork fixture parses these exact public ERC-20 contract addresses, not credentials.
# Both the fixture path AND one of these exact address values must match.
[[allowlists]]
description = "Public ERC-20 identities in the captured production-maker fork fixture"
condition = "AND"
regexTarget = "secret"
paths = ['''^config/production-maker-fork\.json$''']
regexes = [
  '''(?i)^0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913$''',
  '''(?i)^0xfde4C96c8593536E31F229EA8f37b2ADa2699bb2$''',
]
